name: Daily job sweep

on:
  schedule:
    # GitHub cron is UTC. 07:30 Europe/London is 06:30 UTC in summer (BST)
    # and 07:30 UTC in winter (GMT). Both crons are registered; the gate step
    # keeps whichever one matches the current UK offset and skips the other.
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the cron that matches UK time (scheduled runs only)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          # Decide by WHICH cron fired plus the current UK offset, not by the
          # wall-clock hour. GitHub often starts scheduled runs hours late, and a
          # clock-based check would skip every delayed run.
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          offset=$(TZ=Europe/London date +%z)   # +0100 during BST, +0000 during GMT
          case "$CRON|$offset" in
            "30 6 * * *|+0100"|"30 7 * * *|+0000")
              echo "cron '$CRON' matches UK offset $offset - running."
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "cron '$CRON' is the other season's slot (UK offset $offset) - skipping."
              echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run sweep
        if: steps.gate.outputs.run == 'true'
        run: python sweep.py

      - name: Commit results
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "roleradar-bot"
          git config user.email "roleradar-bot@users.noreply.github.com"
          git add seen.json new_roles.csv all_current.csv docs/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "sweep: $(TZ=Europe/London date +'%Y-%m-%d %H:%M')"
            git push
          fi
