# Roleradar target companies.
#
# Each entry:
#   name:  display name
#   ats:   greenhouse | lever | ashby | workable | none
#   token: the board token / company slug for that ATS (omit for "none")
#   lane:  free-text tag shown in the output (group companies however you like)
#   url:   careers page (optional; shown in the "manual check" list for ats: none)
#   note:  anything worth remembering (optional)
#
# "none" = the company uses a system we don't poll (Workday, SmartRecruiters,
# Teamtailor, custom...). They're listed on the output page under "Manual check"
# so you know what the sweep is NOT covering.
#
# Tokens below were verified against the live APIs on 2026-09-09.

